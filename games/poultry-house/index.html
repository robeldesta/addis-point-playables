<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Poultry House</title>
    <!-- Official YouTube Playables SDK. Must load before the game. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game"></div>
    <header id="top">
      <div class="clock"><b id="clock">06:00</b><small id="day">Day 1</small></div>
      <div class="speed" aria-label="Time speed">
        <button data-speed="0" title="Pause">❚❚</button>
        <button data-speed="1" class="on" title="Normal">▶</button>
        <button data-speed="5" title="Fast">▶▶</button>
        <button data-speed="20" title="Very fast">▶▶▶</button>
      </div>
      <button id="camsBtn" class="pill">📷 Cameras</button>
      <button id="logBtn" class="pill">🖥 AI computer <i id="logBadge" class="badge hidden">0</i></button>
      <button id="houseBtn" class="pill hidden">✕ Back to house</button>
    </header>
    <div id="hint">Drag to look · right-drag or two fingers to move · scroll to zoom · tap anything</div>
    <section id="info" class="hidden"></section>
    <div id="infoFeed" class="hidden"></div>
    <aside id="ailog" class="hidden"></aside>
    <div id="monitor" class="hidden">
      <div class="mon-main">
        <div id="feedBox"><canvas id="ai"></canvas><div class="vignette"></div></div>
        <div id="thumbs"></div>
      </div>
      <aside id="feedInfo"></aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
