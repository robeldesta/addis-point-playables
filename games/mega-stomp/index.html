<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Mega Stomp</title>
    <!-- Official YouTube Playables SDK. Must load before the game. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d3d; touch-action: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: Arial, Helvetica, sans-serif; }
      #game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; z-index: 2; pointer-events: none; color: #fff; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
      #score { top: max(10px, env(safe-area-inset-top)); left: 14px; font-size: 26px; }
      #score small { display: block; font-size: 12px; opacity: .85; }
      #sizebox { top: max(10px, env(safe-area-inset-top)); right: 14px; width: min(46vw, 220px); text-align: right; }
      #stage { font-size: 15px; letter-spacing: 1px; color: #ffe066; }
      #mass { font-size: 30px; line-height: 1; }
      #mass small { font-size: 13px; opacity: .85; }
      .bar { height: 12px; background: rgba(0,0,0,.45); border-radius: 8px; overflow: hidden; margin-top: 4px; border: 2px solid rgba(255,255,255,.8); }
      .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(#9cff57, #3fb21a); transition: width .12s; }
      .bar.low i { background: linear-gradient(#ff8a65, #e53935); }
      #hungry { font-size: 12px; color: #ff8a80; height: 14px; margin-top: 2px; opacity: 0; }
      #hungry.show { opacity: 1; animation: blink .5s steps(2) infinite; }
      @keyframes blink { 50% { opacity: .2; } }
      #roar { position: fixed; z-index: 3; right: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 10px);
        width: 86px; height: 86px; border-radius: 50%; border: 4px solid #fff; background: #555; color: #fff;
        font: 900 18px Arial, sans-serif; box-shadow: 0 5px 0 rgba(0,0,0,.35); overflow: hidden; padding: 0; }
      #roar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: #ff7b1c; }
      #roar span { position: relative; }
      #roar.ready { background: #ff7b1c; animation: throb .7s ease-in-out infinite; }
      @keyframes throb { 50% { transform: scale(1.1); } }
      #big { position: fixed; left: 0; right: 0; top: 28%; text-align: center; font-weight: 900; font-size: min(14vw, 84px);
        color: #ffe066; -webkit-text-stroke: 3px #5a1d00; text-shadow: 0 6px 0 rgba(0,0,0,.35); opacity: 0;
        pointer-events: none; z-index: 3; letter-spacing: 2px; }
      #big.show { animation: pop 1.4s ease-out forwards; }
      #big.bad { color: #ff6e6e; -webkit-text-stroke: 3px #3d0000; font-size: min(11vw, 64px); }
      #combo { position: fixed; left: 0; right: 0; top: 18%; text-align: center; font-weight: 900; font-size: 30px; color: #fff;
        -webkit-text-stroke: 2px #1b5e20; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .3s; }
      @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.15); }
        25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
      .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
        background: rgba(25,10,40,.55); color: #fff; text-align: center; padding: 16px; box-sizing: border-box; }
      .screen.show { display: flex; }
      .title { font-size: min(17vw, 92px); font-weight: 900; color: #9cff57; -webkit-text-stroke: 4px #1f3d00; line-height: .9;
        text-shadow: 0 8px 0 rgba(0,0,0,.4); transform: rotate(-4deg); }
      .title b { color: #ff7b1c; -webkit-text-stroke: 4px #4a1600; }
      .tips { margin-top: 22px; font-weight: 800; font-size: 16px; line-height: 1.6; background: rgba(0,0,0,.35); padding: 10px 16px; border-radius: 14px; max-width: 330px; }
      .tips .g { color: #9cff57; } .tips .r { color: #ff8a80; }
      .go { margin-top: 22px; font-size: 24px; font-weight: 900; animation: throb 1s ease-in-out infinite; }
      .card { background: #fff; color: #2b1d3d; border-radius: 20px; padding: 20px 24px; width: min(320px, calc(100vw - 48px)); box-shadow: 0 8px 0 rgba(0,0,0,.3); }
      .card h2 { margin: 0 0 4px; font-size: 22px; }
      .card .why { color: #c62828; font-weight: 800; font-size: 14px; }
      .card .sc { font-size: 60px; font-weight: 900; color: #ff7b1c; line-height: 1.1; }
      .card .stats { font-weight: 700; color: #555; font-size: 14px; line-height: 1.5; }
      .card .new { color: #2e7d32; font-weight: 900; min-height: 20px; }
      .card button { margin-top: 12px; width: 100%; height: 54px; border: 0; border-radius: 14px; background: #7ed321;
        color: #173000; font: 900 22px Arial, sans-serif; box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="hud" id="score">0<small id="bestsm">Best 0</small></div>
    <div class="hud" id="sizebox">
      <div id="stage">HATCHLING</div>
      <div id="mass">10 <small>tons</small></div>
      <div class="bar" id="bar"><i id="barfill"></i></div>
      <div id="hungry">HUNGRY! EAT ZOMBIES</div>
    </div>
    <div id="combo"></div>
    <div id="big"></div>
    <button id="roar"><div class="fill" id="roarfill"></div><span>ROAR</span></button>
    <div class="screen show" id="start">
      <div class="title">MEGA<br><b>STOMP</b></div>
      <div class="tips">
        Drag to steer your dino<br>
        <span class="g">Green ring</span> = small enough to smash<br>
        <span class="r">Red ring</span> = too big, dodge it!<br>
        Eat zombies to grow. Stop eating and you shrink.
      </div>
      <div class="go">Tap to stomp</div>
    </div>
    <div class="screen" id="over">
      <div class="card">
        <h2>Rampage over</h2>
        <div class="why" id="why"></div>
        <div class="sc" id="final">0</div>
        <div class="stats" id="stats"></div>
        <div class="new" id="newbest"></div>
        <button id="again">Stomp again</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
